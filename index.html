<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Circuit Simulator</title>
</head>
<body style="margin:0;background:#0b0f14;color:#e7f0f7;font-family:Arial,sans-serif">
  <p id="loading" style="padding:16px">Opening Circuitry…</p>
  <script>
  (async()=>{
    const loading=document.getElementById('loading');
    try{
      const response=await fetch('./grid_native_circuit_simulator.html',{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      let html=await response.text();

      // Make every grid lattice point touched by a wire a real electrical node.
      // This fixes T-junctions, midpoint taps and grid-point wire crossings.
      const oldNodeBlock=`  const nodeSet=new Set();
  for(const w of wires){nodeSet.add(w.a);nodeSet.add(w.b)}
  for(const p of parts)for(const t of terminals(p))nodeSet.add(nodeKey(t.x,t.y));
  const nodes=[...nodeSet];`;
      const newNodeBlock=`  function wireLatticeKeys(w){
    const [ax,ay]=w.a.split(',').map(Number),[bx,by]=w.b.split(',').map(Number);
    const dx=bx-ax,dy=by-ay;
    const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b)[a,b]=[b,a%b];return a||1};
    const steps=gcd(dx,dy),keys=[];
    for(let i=0;i<=steps;i++)keys.push((ax+dx*i/steps)+','+(ay+dy*i/steps));
    return keys;
  }
  const nodeSet=new Set();
  for(const w of wires)for(const k of wireLatticeKeys(w))nodeSet.add(k);
  for(const p of parts)for(const t of terminals(p))nodeSet.add(nodeKey(t.x,t.y));
  const nodes=[...nodeSet];`;
      if(!html.includes(oldNodeBlock))throw new Error('Junction node patch target not found');
      html=html.replace(oldNodeBlock,newNodeBlock);

      const oldWireUnion=`  // Wires connect any two arbitrary grid nodes.
  for(const w of wires)dsu.u(idx.get(w.a),idx.get(w.b));`;
      const newWireUnion=`  // A wire electrically connects every lattice point that lies on it.
  // Therefore a terminal or another wire touching its midpoint becomes a real junction.
  for(const w of wires){
    const ks=wireLatticeKeys(w);
    for(let i=1;i<ks.length;i++)dsu.u(idx.get(ks[i-1]),idx.get(ks[i]));
  }`;
      if(!html.includes(oldWireUnion))throw new Error('Junction union patch target not found');
      html=html.replace(oldWireUnion,newWireUnion);

      const oldEdges=`  const edges=wires.map(w=>({a:idx.get(w.a),b:idx.get(w.b),wire:w}));`;
      const newEdges=`  const edges=[];
  for(const w of wires){
    const ks=wireLatticeKeys(w);w.flowSegments=[];
    for(let i=1;i<ks.length;i++)edges.push({a:idx.get(ks[i-1]),b:idx.get(ks[i]),wire:w,ka:ks[i-1],kb:ks[i],segmentIndex:i-1});
  }`;
      if(!html.includes(oldEdges))throw new Error('Wire segment patch target not found');
      html=html.replace(oldEdges,newEdges);

      const oldEdgeResult=`    if(edge.wire)edge.wire.approxI=I;
    else {edge.part.i=I;edge.part.termI.a=I;edge.part.termI.b=-I}`;
      const newEdgeResult=`    if(edge.wire){
      edge.wire.flowSegments[edge.segmentIndex]={a:edge.ka,b:edge.kb,I};
      if(edge.segmentIndex===0)edge.wire.approxI=I;
    }else {edge.part.i=I;edge.part.termI.a=I;edge.part.termI.b=-I}`;
      if(!html.includes(oldEdgeResult))throw new Error('Wire flow result patch target not found');
      html=html.replace(oldEdgeResult,newEdgeResult);

      const oldDrawFlow=`function drawElectronFlow(w){
  drawElectronFlowSegment(nodeXY(w.a),nodeXY(w.b),w.approxI||0);
}`;
      const newDrawFlow=`function drawElectronFlow(w){
  if(Array.isArray(w.flowSegments)&&w.flowSegments.length){
    for(const s of w.flowSegments)drawElectronFlowSegment(nodeXY(s.a),nodeXY(s.b),s.I||0);
  }else drawElectronFlowSegment(nodeXY(w.a),nodeXY(w.b),w.approxI||0);
}`;
      if(!html.includes(oldDrawFlow))throw new Error('Wire electron-flow patch target not found');
      html=html.replace(oldDrawFlow,newDrawFlow);

      // Ground symbols are explicit physical return points for the visual current solver.
      const oldGroundBlock=`  for(const p of parts)for(const t of terminals(p)){
    injection[idx.get(nodeKey(t.x,t.y))]+=p.termI[t.name]||0;
  }`;
      const newGroundBlock=`  const groundFlowTerms=[];
  for(const p of parts)for(const t of terminals(p)){
    const n=idx.get(nodeKey(t.x,t.y));if(n==null)continue;
    if(p.type==='GND')groundFlowTerms.push({p,node:n});
    else injection[n]+=p.termI[t.name]||0;
  }
  const flowBalance=new Map();
  for(let i=0;i<nodes.length;i++){
    const root=flowDSU.f(i);
    flowBalance.set(root,(flowBalance.get(root)||0)+injection[i]);
  }
  const groundsByFlow=new Map();
  for(const g of groundFlowTerms){
    const root=flowDSU.f(g.node);
    if(!groundsByFlow.has(root))groundsByFlow.set(root,[]);
    groundsByFlow.get(root).push(g);
  }
  for(const [root,gs] of groundsByFlow){
    const share=-(flowBalance.get(root)||0)/gs.length;
    for(const g of gs){injection[g.node]+=share;g.p.termI.g=share}
  }`;
      if(!html.includes(oldGroundBlock))throw new Error('Ground-flow patch target not found');
      html=html.replace(oldGroundBlock,newGroundBlock);

      const initBlock=`initChipLibrary();refreshInspector();updateStatus();requestAnimationFrame(frame);`;
      const autosaveBlock=`const CIRCUIT_STORAGE='circuitry.autosave.v1';
function saveWorkspace(){
  try{
    const cleanParts=parts.map(p=>{
      const q={id:p.id,type:p.type,x:p.x,y:p.y,rot:p.rot,capV:Number.isFinite(p.capV)?p.capV:0};
      if(p.chipId!=null)q.chipId=p.chipId;
      for(const k of Object.keys(defaults[p.type]||{}))q[k]=p[k];
      return q;
    });
    const cleanWires=wires.map(w=>({id:w.id,a:w.a,b:w.b,...(w.chipId!=null?{chipId:w.chipId}:{})}));
    const state={version:1,parts:cleanParts,wires:cleanWires,chipGroups:chipGroups.map(g=>({...g})),nextId,
      view:{scale:viewScale,x:viewX,y:viewY},dt:Number(document.getElementById('dtInput').value)||.001,
      running,showElectrons,simTime};
    localStorage.setItem(CIRCUIT_STORAGE,JSON.stringify(state));
  }catch(err){console.warn('Circuit autosave failed',err)}
}
function restoreWorkspace(){
  try{
    const state=JSON.parse(localStorage.getItem(CIRCUIT_STORAGE)||'null');
    if(!state||state.version!==1||!Array.isArray(state.parts)||!Array.isArray(state.wires))return;
    const validCoord=n=>Number.isFinite(n)&&Math.abs(n)<1e8&&n%GRID===0;
    const restoredParts=[];
    for(const s of state.parts){
      if(!s||!Object.hasOwn(defaults,s.type)||!Number.isInteger(s.id)||!validCoord(s.x)||!validCoord(s.y)||!Number.isInteger(s.rot))continue;
      const p={id:s.id,type:s.type,x:s.x,y:s.y,rot:((s.rot%4)+4)%4,...clone(defaults[s.type]),terminalV:{},termI:{},i:0,capV:Number.isFinite(s.capV)?s.capV:0};
      for(const k of Object.keys(defaults[s.type]))if(typeof s[k]===typeof defaults[s.type][k]&&(typeof s[k]!=='number'||Number.isFinite(s[k])))p[k]=s[k];
      if(Number.isInteger(s.chipId))p.chipId=s.chipId;
      restoredParts.push(p);
    }
    const restoredWires=[];
    for(const s of state.wires){
      if(!s||!Number.isInteger(s.id)||typeof s.a!=='string'||typeof s.b!=='string'||!/^[-]?\\d+,[-]?\\d+$/.test(s.a)||!/^[-]?\\d+,[-]?\\d+$/.test(s.b))continue;
      const w={id:s.id,a:s.a,b:s.b,approxI:0};if(Number.isInteger(s.chipId))w.chipId=s.chipId;restoredWires.push(w);
    }
    parts.splice(0,parts.length,...restoredParts);wires.splice(0,wires.length,...restoredWires);
    chipGroups.splice(0,chipGroups.length,...(Array.isArray(state.chipGroups)?state.chipGroups.filter(g=>g&&Number.isInteger(g.id)&&typeof g.name==='string'&&typeof g.color==='string').map(g=>({...g})):[]));
    selection.clear();selected=null;wireStart=null;
    const ids=[...parts,...wires,...chipGroups].map(o=>o.id).filter(Number.isInteger);
    nextId=Math.max(Number.isInteger(state.nextId)?state.nextId:1,ids.length?Math.max(...ids)+1:1);
    if(state.view&&Number.isFinite(state.view.scale)&&Number.isFinite(state.view.x)&&Number.isFinite(state.view.y)){
      viewScale=Math.max(.25,Math.min(4,state.view.scale));viewX=state.view.x;viewY=state.view.y;
    }
    if(Number.isFinite(state.dt)&&state.dt>0)document.getElementById('dtInput').value=state.dt;
    if(typeof state.running==='boolean')running=state.running;
    if(typeof state.showElectrons==='boolean')showElectrons=state.showElectrons;
    if(Number.isFinite(state.simTime))simTime=state.simTime;
    document.getElementById('runBtn').classList.toggle('active',running);
    document.getElementById('runBtn').textContent=running?'Run':'Paused';
    document.getElementById('electronBtn').classList.toggle('active',showElectrons);
  }catch(err){console.warn('Circuit restore failed',err)}
}
restoreWorkspace();
setInterval(saveWorkspace,500);
addEventListener('beforeunload',saveWorkspace);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveWorkspace()});
initChipLibrary();refreshInspector();updateStatus();requestAnimationFrame(frame);`;
      if(!html.includes(initBlock))throw new Error('Autosave patch target not found');
      html=html.replace(initBlock,autosaveBlock);

      document.open();
      document.write(html);
      document.close();
    }catch(err){
      loading.textContent='Circuitry failed to load: '+err.message;
      console.error(err);
    }
  })();
  </script>
</body>
</html>
